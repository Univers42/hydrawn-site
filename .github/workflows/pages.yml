# The public address, hydrawn.js.org, on Cloudflare Pages (project "hydrawn"). Run by hand,
# and only once the repository has the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets; the production environment waits for an approval before it deploys.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gate and build
        run: make install check build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name hydrawn --branch main
