# The public site on Cloudflare Pages (project "hydrawn", https://hydrawn.pages.dev),
# deployed from main once the gate passes. The repository variable PUBLIC_APP_URL is where
# its "Start drawing" links go; unset means the real address (src/lib/app.ts).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gate and build
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: make install check build
      # Wrangler itself rather than wrangler-action: the action reads pnpm-lock.yaml and
      # runs pnpm, which exists here only inside the Docker tooling, never on the runner.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        # 4.149.0 is from 2026-10-08: past the 7-day hold.
        run: npx -y wrangler@4.149.0 pages deploy dist --project-name hydrawn --branch main
