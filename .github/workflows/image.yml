# The gate on every push and pull request; on main, the production image goes to GHCR:
# ghcr.io/univers42/hydrawn-site:latest (and :sha-<commit>), the same image `make up` runs.
name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gate (astro check, eslint, prettier)
        run: make install check
      - name: The production image builds and serves the site
        run: |
          docker compose up -d --build
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8321/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8321/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8321/no-such-page)" = 404
          docker compose down

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/univers42/hydrawn-site
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
